    // 热点
    Engine.eventsNow().forEach(ev => {
      if (ev.scene !== sceneId) return;
      const bob = Math.sin(now / 300 + ev.pos[0]) * 4;
      ctx.fillStyle = '#b8432f';
      ctx.beginPath(); ctx.arc(ev.pos[0], ev.pos[1] - 46 + bob, 13, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 16px serif'; ctx.textAlign = 'center';
      ctx.fillText('记', ev.pos[0], ev.pos[1] - 41 + bob);
      ctx.fillStyle = 'rgba(40,30,20,.75)'; roundRect(ctx, ev.pos[0] - 34, ev.pos[1] - 26, 68, 20, 10); ctx.fill();
      ctx.fillStyle = '#f3efe4'; ctx.font = '11px sans-serif';
      ctx.fillText(ev.name, ev.pos[0], ev.pos[1] - 12);
    });
    // NPC
    const sortables = npcs.map(n => ({ y: n.y, draw: () => drawNPC(n, now) }));
    sortables.push({ y: player.y, draw: () => drawPlayer(now) });
    sortables.sort((a, b) => a.y - b.y).forEach(o => o.draw());
    ctx.restore();
    // 时段氛围
    const per = Engine.period();
    if (per === 'morning') { ctx.fillStyle = 'rgba(255,190,120,.10)'; ctx.fillRect(0, 0, vw, vh); }
    else if (per === 'aft') { ctx.fillStyle = 'rgba(255,215,150,.07)'; ctx.fillRect(0, 0, vw, vh); }
    else if (per === 'eve') { ctx.fillStyle = 'rgba(18,22,48,.34)'; ctx.fillRect(0, 0, vw, vh); }
    // 暗角
    const g = ctx.createRadialGradient(vw / 2, vh / 2, vh * 0.4, vw / 2, vh / 2, vh * 0.95);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(20,15,5,.22)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, vw, vh);
  }
  function drawNPC(n, now) {
    const bob = Math.sin(now / 450 + n.x) * 1.5;
    ctx.save(); ctx.translate(n.x, n.y + bob);
    drawAvatar(ctx, n.p, 0, 0, 56);
    if (n.busy) { // 事件人物头上有笔墨提示
      ctx.fillStyle = '#b8432f'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('◆', 20, -34);
    }
    // 名牌
    const name = n.p.hao || n.p.name;
    ctx.font = '11px sans-serif';
    const w = ctx.measureText(name).width + 14;
    ctx.fillStyle = 'rgba(252,250,244,.82)'; roundRect(ctx, -w / 2, -44, w, 18, 9); ctx.fill();
    ctx.fillStyle = '#403a2e'; ctx.textAlign = 'center'; ctx.fillText(name, 0, -31);
    ctx.restore();
  }
  function drawPlayer(now) {
    ctx.save(); ctx.translate(player.x, player.y);
    const bob = Math.sin(now / 160) * (player.path.length ? 2.2 : 1);
    ctx.translate(0, bob * 0.4);
    // 主角：白衫 + 朱砂围巾
    ctx.fillStyle = 'rgba(30,26,16,.2)'; ctx.beginPath(); ctx.ellipse(0, 30, 20, 7, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#f4efe2'; roundRect(ctx, -14, 8, 28, 26, 10); ctx.fill();
    ctx.fillStyle = '#b8432f'; roundRect(ctx, -12, 8, 24, 8, 5); ctx.fill();
    ctx.fillStyle = '#f2d6b3'; ctx.beginPath(); ctx.arc(0, -6, 15, 0, 7); ctx.fill();
    ctx.fillStyle = '#1c1812'; roundRect(ctx, -14, -20, 28, 11, 4); ctx.fill();
    ctx.fillStyle = '#2c2820';
    ctx.beginPath(); ctx.arc(-5, -4, 1.7, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(5, -4, 1.7, 0, 7); ctx.fill();
    // 手中笔
    ctx.strokeStyle = '#26241f'; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(16, 14); ctx.lineTo(23, 4); ctx.stroke();
    ctx.fillStyle = '#b8432f'; ctx.beginPath(); ctx.arc(23.6, 3, 2.2, 0, 7); ctx.fill();
    const name = '音克思';
    ctx.font = '11px sans-serif';
    const w = ctx.measureText(name).width + 14;
    ctx.fillStyle = 'rgba(184,67,47,.92)'; roundRect(ctx, -w / 2, -44, w, 18, 9); ctx.fill();
    ctx.fillStyle = '#fff6f0'; ctx.textAlign = 'center'; ctx.fillText(name, 0, -31);
    ctx.restore();
  }

  /* ---- 移动 ---- */
  function tickMove(dt) {
    // 键盘优先
    let kx = (keys.d || keys.ArrowRight ? 1 : 0) - (keys.a || keys.ArrowLeft ? 1 : 0);
    let ky = (keys.s || keys.ArrowDown ? 1 : 0) - (keys.w || keys.ArrowUp ? 1 : 0);
    if (kx || ky) {
      player.path = [];
      const len = Math.hypot(kx, ky) || 1;
      tryMove(kx / len * player.speed * dt, ky / len * player.speed * dt);
    } else if (player.path.length) {
      const t = player.path[0];
      const dx = t.x - player.x, dy = t.y - player.y, d = Math.hypot(dx, dy);
      if (d < 6) player.path.shift();
      else tryMove(dx / d * player.speed * dt, dy / d * player.speed * dt);
    }
    // 门检测
    if (doorCd > 0) doorCd -= dt;
    else {
      const d = scene.doors.find(d => player.x > d.x - 6 && player.x < d.x + d.w + 6 && player.y > d.y - 6 && player.y < d.y + d.h + 6);
      if (d) {
        Sfx.page();
        const at = doorTarget(d);
        if (d.inner && d.zone === 'principal') { enterScene('office', at); doorCd = 0.5; UI.toastScene('校长室'); }
        else { enterScene(d.to, at); doorCd = 0.5; UI.toastScene(SCENE_BY_ID[d.to].name); }
      }
    }
  }
  function collides(x, y) {
    if (x < 26 || y < 26 || x > scene.w - 26 || y > scene.h - 26) return true;
    for (const pr of scene.props) {
      if (['window', 'track', 'mat', 'board'].includes(pr.t)) continue;
      if (x > pr.x - 12 && x < pr.x + pr.w + 12 && y > pr.y - 10 && y < pr.y + pr.h + 12) return true;
    }
    return false;
  }
  function tryMove(dx, dy) {
    if (!collides(player.x + dx, player.y)) player.x += dx;
    if (!collides(player.x, player.y + dy)) player.y += dy;
  }

  /* ---- 输入 ---- */
  function toWorld(mx, my) {
    const vw2 = window.innerWidth / cam.scale, vh2 = window.innerHeight / cam.scale;
    return { x: (mx / cam.scale) + cam.x - vw2 / 2, y: (my / cam.scale) + cam.y - vh2 / 2 };
  }
  cv.addEventListener('pointerdown', e => {
    if (Dialog.active || MG.active) return;
    const r = cv.getBoundingClientRect();
    const w = toWorld(e.clientX - r.left, e.clientY - r.top);
    // 热点
    const ev = Engine.eventsNow().find(ev => ev.scene === sceneId && Math.hypot(w.x - ev.pos[0], w.y - ev.pos[1] + 20) < 44);
    if (ev) { Main.onEvent(ev); return; }
    // NPC
    const n = npcs.find(n => Math.hypot(w.x - n.x, w.y - n.y + 6) < 36);
    if (n) { Main.onNPC(n.p); return; }
    // 移动
    const path = bfsPath(player.x, player.y, w.x, w.y);
    if (path) { path.shift(); player.path = path; }
  });
  window.addEventListener('keydown', e => { keys[e.key] = true; if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault(); });
  window.addEventListener('keyup', e => { keys[e.key] = false; });

  /* ---- 主循环 ---- */
  let last = performance.now();
  function loop() {
    const now = performance.now();
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (scene && !MG.active) {
      tickMove(dt);
      draw();
      // 邻近检测：事件优先（限时时限，错过不再来），其次 NPC
      let best = null;
      Engine.eventsNow().forEach(ev => { if (ev.scene !== sceneId) return; const d = Math.hypot(ev.pos[0] - player.x, ev.pos[1] - player.y); if (d < 100) best = { type: 'event', ev }; });
      if (!best) {
        let bd = 90;
        npcs.forEach(n => { const d = Math.hypot(n.x - player.x, n.y - player.y); if (d < bd) { bd = d; best = { type: 'npc', p: n.p }; } });
      }
      if (!best) {
        const door = scene.doors.find(d => Math.hypot(d.x + d.w / 2 - player.x, d.y + d.h / 2 - player.y) < 70);
        if (door) best = { type: 'door', door };
      }
      if ((best && !near) || (!best && near) || (best && near && JSON.stringify(best) !== JSON.stringify(near))) { near = best; onCtx && onCtx(near); }
    }
    requestAnimationFrame(loop);
  }

  return {
    get sceneId() { return sceneId; },
    get playerPos() { return [player.x, player.y]; },
    get active() { return !!scene; },
    enter(id) { enterScene(id); cam.x = player.x; cam.y = player.y; },
    refresh() { if (scene) refreshNPCs(); },
    setOnCtx(f) { onCtx = f; },
    start() { requestAnimationFrame(loop); },
    travel(id) { if (SCENE_BY_ID[id]) { Sfx.page(); enterScene(id); UI.toastScene(SCENE_BY_ID[id].name); } },
    walkTo(x, y) { const p = bfsPath(player.x, player.y, x, y); if (p) { p.shift(); player.path = p; } },
    resetNear() { near = null; },
    npcPos(id) { const n = npcs.find(n => n.p.id === id); return n ? [n.x, n.y] : null; },
    isNearNPC(id) { return npcs.some(n => n.p.id === id && Math.hypot(n.x - player.x, n.y - player.y) < 90); },
    avatarCanvas(p, size) {
      const c = document.createElement('canvas');
      const d = window.devicePixelRatio || 1;
      c.width = size * d; c.height = size * 1.25 * d;
      c.style.width = size + 'px'; c.style.height = size * 1.25 + 'px';
      const cc = c.getContext('2d'); cc.scale(d, d);
      drawAvatar(cc, p, size / 2, size * 0.56, size * 0.8);
      return c;
    },
  };
})();

</script>
<script>
/* 实验史记·春秋笔 —— 对话系统：剧本播放 / 立绘 / 选项 */
'use strict';

/* 剧本中出现、但不进入图鉴的师长配角 */
const MINOR_FIGS = {
  '为兵':  { name:'为兵',    look:{ hair:'#2a2620', style:'short', glasses:true, acc:'📷' }, role:'t', cls:'7' },
  '钦法':  { name:'钦法',    look:{ hair:'#3a352c', style:'short', acc:'📋' }, role:'t', cls:'t' },
  '晓东':  { name:'晓东',    look:{ hair:'#26221c', style:'short', glasses:true, acc:'📐' }, role:'t', cls:'6' },
  '杨杰':  { name:'杨杰',    look:{ hair:'#4a4438', style:'short', acc:'🔑' }, role:'t', cls:'t' },
  '杨洪波': { name:'杨洪波',  look:{ hair:'#1c1812', style:'spiky', acc:'📢' }, role:'t', cls:'t' },
  '王明虎': { name:'王明虎',  look:{ hair:'#565043', style:'short', acc:'🌏' }, role:'t', cls:'6' },
  '卓本':  { name:'卓本',    look:{ hair:'#221e18', style:'short', acc:'🫓' }, role:'s', cls:'6' },
  '组员们': { name:'组员们',  look:{ hair:'#33302a', style:'short' }, role:'s', cls:'6' },
  '舍友们': { name:'舍友们',  look:{ hair:'#33302a', style:'messy' }, role:'s', cls:'6' },
};
function resolveFig(who) {
  if (!who || who === '旁白') return null;
  if (who === '音克思') return 'PLAYER';
  if (PEOPLE_BY_ID[who]) return PEOPLE_BY_ID[who];
  const byName = PEOPLE.find(p => p.name === who || p.hao === who);
  if (byName) return byName;
  if (MINOR_FIGS[who]) return MINOR_FIGS[who];
  return null;
}

const Dialog = (() => {
  const root = $('#dialog'), cast = $('#dialog-cast'), box = $('#dialog-box');
  const nameEl = $('#dialog-name'), textEl = $('#dialog-text'), choicesEl = $('#dialog-choices'), nextBtn = $('#dialog-next');
  let steps = [], idx = 0, onDone = null, active = false;
  let typing = false, typeTimer = null, figs = {};
  let stepOver = null; // 选择后的附加处理

  function setFigs(who) {
    const f = resolveFig(who);
    if (!f) return;
    ensureFig(f);
    const key = f === 'PLAYER' ? 'PLAYER' : f.id || f.name;
    Object.entries(figs).forEach(([k, elx]) => elx.classList.toggle('dim', k !== key));
  }
  function ensureFig(f) {
    const key = f === 'PLAYER' ? 'PLAYER' : f.id || f.name;
    if (figs[key]) return figs[key];
    const figEl = el('div', 'cast-fig');
    const cvs = f === 'PLAYER'
      ? World.avatarCanvas({ look:{ hair:'#1c1812', style:'flat' }, role:'x', cls:'x' }, 190)
      : World.avatarCanvas(f, 190);
    figEl.appendChild(cvs);
    figEl.appendChild(el('div', 'cast-label', f === 'PLAYER' ? '音克思' : (f.hao && f.hao !== f.name ? `${f.name} · ${f.hao}` : f.name)));
    cast.appendChild(figEl);
    figs[key] = figEl;
    const keys = Object.keys(figs);
    if (keys.length > 3) { figs[keys[0]].remove(); delete figs[keys[0]]; }
    return figEl;
  }
  function preSpawn() {
    steps.forEach(st => {
      if (!st.who || st.who === '旁白') return;
      const f = resolveFig(st.who);
      if (f) ensureFig(f);
    });
    Object.values(figs).forEach(elx => elx.classList.add('dim'));
  }

  function showStep() {
    if (idx >= steps.length) return finish();
    const st = steps[idx++];
    if (st.ach) { Engine.award(st.ach); return showStep(); }
    if (st.mg) {
      MG.launch(st.mg, ok => {
        if (st._mgResult == null) st._mgResult = ok;
        showStep();
      });
      return;
    }
    if (st.choice) { renderChoices(st.choice); return; }
    setFigs(st.who);
    nameEl.textContent = st.who === '旁白' ? '——' : st.who;
    nameEl.style.opacity = st.who === '旁白' ? 0.55 : 1;
    typewrite(st.text);
  }

  function typewrite(text) {
    typing = true; textEl.classList.add('typing');
    textEl.textContent = '';
    choicesEl.innerHTML = '';
    nextBtn.style.visibility = 'hidden';
    const full = G.settings.speed >= 2 ? '' : text;
    if (!full) { textEl.textContent = text; typing = false; textEl.classList.remove('typing'); nextBtn.style.visibility = 'visible'; return; }
    let i = 0;
    clearInterval(typeTimer);
    typeTimer = setInterval(() => {
      i += 1;
      textEl.textContent = text.slice(0, i);
      if (i >= text.length) { clearInterval(typeTimer); typing = false; textEl.classList.remove('typing'); nextBtn.style.visibility = 'visible'; }
    }, 26);
  }

  function completeOrNext() {
    if (!active) return;
    if (typing) { clearInterval(typeTimer); typing = false; textEl.classList.remove('typing');
      const st = steps[idx - 1]; textEl.textContent = st.text; nextBtn.style.visibility = 'visible'; return; }
    Sfx.tap();
    showStep();
  }

  function renderChoices(list) {
    textEl.textContent = '（你要——）';
    nextBtn.style.visibility = 'hidden';
    choicesEl.innerHTML = '';
    list.forEach(c => {
      const b = el('button', 'choice-btn');
      b.innerHTML = `${c.t}${c.fx ? `<span class="fx">${c.fx}</span>` : ''}`;
      b.onclick = () => {
        Sfx.tap();
        choicesEl.innerHTML = '';
        nextBtn.style.visibility = 'visible';
        let result = null;
        if (c.run) result = c.run() || null;
        if (c.favor) Object.entries(c.favor).forEach(([id, v]) => Engine.addFavor(id, v));
        if (c.rep) Engine.addRep(c.rep);
        if (c.wen) Engine.addWen(c.wen);
        if (c.money) Engine.addMoney(c.money);
        const say = (result && result.say) || c.say;
        if (say) { steps.splice(idx, 0, say); }
        Save.write();
        showStep();
      };
      choicesEl.appendChild(b);
    });
  }

  function finish() {
    active = false;
    Spring.make({ x0: 0, target: 40, damping: 1, response: 0.25, update: x => { box.style.transform = `translateY(${x}px)`; box.style.opacity = String(1 - x / 60); }, done: () => {
      root.classList.add('hidden'); cast.innerHTML = ''; figs = {}; box.style.transform = ''; box.style.opacity = '';
      Main.afterDialog();
      World.resetNear();
      flushToasts();
      const cb = onDone; onDone = null; cb && cb();
    } });
  }

  return {
    get active() { return active; },
    play(script, done) {
      steps = script.slice(); idx = 0; onDone = done || null; active = true;
      cast.innerHTML = ''; figs = {};
      preSpawn();
      $('#ctxbar').classList.add('hidden');
      root.classList.remove('hidden');
      box.style.transform = 'translateY(40px)'; box.style.opacity = '0.4';
      Spring.make({ x0: 40, target: 0, damping: 0.85, response: 0.38, update: (x) => { box.style.transform = `translateY(${x}px)`; box.style.opacity = String(1 - x / 80); } });
      showStep();
    },
    tap: completeOrNext,
  };
})();

$('#dialog-box').addEventListener('click', e => { if (e.target.id !== 'dialog-next' && !e.target.closest('.choice-btn')) Dialog.tap(); });
$('#dialog-next').addEventListener('click', () => Dialog.tap());

</script>
<script>
/* 实验史记·春秋笔 —— 撰史系统：拼版 / 笔法 / 品级 */
'use strict';

const Writing = (() => {
  let volNo = 0;
  let placed = { qi: null, cheng: null, zhuan: null, he: null }; // shardId
  let style = '直';

  /* 某卷可用的全部史料：卷池 + 该卷所有采访/额外史料（如 sh_pingpong） */
  function volPool(no) { return Object.keys(SHARDS).filter(id => SHARDS[id].vol === no); }

  const SLOT_KEYS = ['qi', 'cheng', 'zhuan', 'he'];
  function slotDef(k) { return SLOTS.find(s => s.key === k); }
  function accepts(slotKey, shardId) {
    const def = slotDef(slotKey);
    const tags = SHARDS[shardId].tags;
    if (def.only && !def.only.some(t => tags.includes(t))) return false;
    return true;
  }
  function autoSlotFor(shardId) {
    const tags = SHARDS[shardId].tags;
    // 合槽优先收评
    if (tags.includes('评') && !placed.he) return 'he';
    for (const k of ['qi', 'cheng', 'zhuan']) {
      if (placed[k]) continue;
      if (!accepts(k, shardId)) continue;
      if (slotDef(k).prefer.some(t => tags.includes(t))) return k;
    }
    for (const k of ['qi', 'cheng', 'zhuan']) if (!placed[k] && accepts(k, shardId)) return k;
    return null;
  }

  function score() {
    let s = 0;
    SLOT_KEYS.forEach(k => {
      const id = placed[k];
      if (!id) return;
      const def = slotDef(k);
      const tags = SHARDS[id].tags;
      const mult = def.prefer.some(t => tags.includes(t)) ? 1.5 : 1;
      s += G.shards[id].wen * mult;
    });
    s += G.wen * 0.25;
    if (style === '直') s += 2;
    return Math.round(s * 10) / 10;
  }
  function gradeOf(s) { return s >= 36 ? 4 : s >= 28 ? 3 : s >= 20 ? 2 : 1; }
  function gradeName(g) { return { 4:'神品', 3:'上品', 2:'中品', 1:'下品' }[g]; }

  function render() {
    const v = VOL_BY_NO[volNo];
    UI.openPanel(`撰史 · ${v.title}（${v.i}）`, body => {
      const grid = el('div', 'writ-grid');
      /* 左：四槽 + 笔法 + 发表 */
      const left = el('div', '');
      const slots = el('div', 'slot-row');
      SLOT_KEYS.forEach(k => {
        const def = slotDef(k);
        const id = placed[k];
        const slot = el('div', 'slot' + (id ? '' : ' empty'));
        slot.innerHTML = `<span class="slot-tag">${def.tag}</span>
          ${id ? `<div class="s-name">${SHARDS[id].name} <span class="pill gold">${SHARDS[id].tags.join('')} · 文${G.shards[id].wen}</span></div>
                  <div class="s-text">${SHARDS[id].text}</div>`
               : `<div class="s-name">${def.label}</div><div class="s-text">${k === 'he' ? '只收「评」——采访所得' : '点右侧史料放入'}</div>`}`;
        slot.onclick = () => {
          if (placed[k]) { delete placed[k]; Sfx.tap(); render(); }
        };
        slots.appendChild(slot);
      });
      left.appendChild(slots);
      // 笔法
      const styleRow = el('div', '');
      styleRow.style.cssText = 'display:flex;gap:8px;margin:14px 0;align-items:center';
      styleRow.innerHTML = '<b style="font-size:13.5px">笔法：</b>';
      [['直', '直笔 · 据实而书（声望+2，传主未必高兴）'], ['曲', '曲笔 · 温柔敦厚（传主欢喜，声望-2）']].forEach(([key, tip]) => {
        const b = el('button', 'seg' + (style === (key === '直' ? '直' : '曲') ? ' on' : ''), key + '笔');
        b.title = tip;
        b.onclick = () => { style = key === '直' ? '直' : '曲'; Sfx.tap(); render(); };
        styleRow.appendChild(b);
      });
      left.appendChild(styleRow);
      left.appendChild(el('div', 'muted', `预计得分 ${score()} · 文笔 ${G.wen}（≥${v.minWen} 可发）· 神品≥36 上品≥28 中品≥20`));
      const pubBtn = el('button', 'btn btn-primary', '定稿 · 发表此卷');
      pubBtn.style.cssText = 'width:100%;margin-top:12px;padding:14px;font-size:17px';
      pubBtn.onclick = () => publish();
      left.appendChild(pubBtn);
      grid.appendChild(left);
      /* 右：史料池 */
      const right = el('div', '');
      right.appendChild(el('div', 'muted', `本卷史料（点选入槽，点槽可取回）`));
      const pool = el('div', 'shard-pool');
      pool.style.marginTop = '8px';
      const owned = volPool(volNo).filter(s => G.shards[s]);
      owned.forEach(sid => {
        const sh = SHARDS[sid];
        const used = Object.values(placed).includes(sid);
        const card = el('div', 'shard-card' + (used ? ' used' : ''));
        const srcName = { scene:'亲历', gossip:'转述', interview:'采访' }[G.shards[sid].src] || '';
        card.innerHTML = `<div class="sc-tags">${sh.tags.join('')} · 文${G.shards[sid].wen} · ${srcName}</div>
          <div class="sc-name">${sh.name}</div><div class="sc-text">${sh.text}</div>`;
        card.onclick = () => {
          if (used) return;
          const k = autoSlotFor(sid);
          if (!k) { toast('四槽已满，点槽取回一条再放'); return; }
          placed[k] = sid; Sfx.page(); render();
        };
        pool.appendChild(card);
      });
      const missing = volPool(volNo).filter(s => !G.shards[s]);
      if (missing.length) {
        pool.appendChild(el('div', 'muted', `尚缺 ${missing.length} 条：「${missing.map(s => SHARDS[s].name).join('」「')}」。缺料也可发（凑满四槽即可），但选择少了。`));
      }
      right.appendChild(pool);
      grid.appendChild(right);
      body.appendChild(grid);
    });
  }

  function checks() {
    const v = VOL_BY_NO[volNo];
    if (SLOT_KEYS.some(k => !placed[k])) { toast('四槽未满，不成卷'); return false; }
    if (G.wen < v.minWen) { toast(`文笔不足（${G.wen}/${v.minWen}），去图书馆读书、写日记`, '恶'); return false; }
    if (v.needFavor && Engine.favorOf(v.needFavor.id) < v.needFavor.v) {
      toast(v.needFavor.hint, '恶'); return false;
    }
    return true;
  }

  function publish() {
    if (!checks()) return;
    const v = VOL_BY_NO[volNo];
    const s = score(), g = gradeOf(s);
    // 落卷
    G.vols[volNo] = { grade: g, score: s, style, shards: SLOT_KEYS.map(k => placed[k]) };
    G.stats.published++;
    Engine.addWen(5);
    Engine.addRep(v.rep + (style === '直' ? 2 : -2));
    Engine.addMoney(v.money);
    Object.entries(v.favor).forEach(([id, n]) => Engine.addFavor(id, n));
    if (style === '直') {
      G.stats.direct++;
      Engine.award('ach_direct');
      Engine.addFavor(v.cast[0], -4);
    } else {
      G.stats.curve++;
      Engine.award('ach_curve');
      Engine.addFavor(v.cast[0], 4);
    }
    if (volNo === 8) Engine.award('ach_v8');
    if (G.stats.published >= 8) Engine.award('ach_half');
    if (G.stats.published >= 15) {
      const avg = Object.values(G.vols).reduce((a, b) => a + b.grade, 0) / 15;
      if (avg >= 3) Engine.award('ach_taishi');
    }
    Sfx.seal();
    Save.write();
    // 判词画面
    UI.openPanel(`发刊 · ${v.title}`, body => {
      const verd = el('div', 'writ-verdict');
      verd.innerHTML = `
        <div class="muted" style="letter-spacing:.4em;margin-bottom:6px">实 验 史 记 · 卷${v.i}</div>
        <h3 style="font-family:var(--font-cl);font-size:22px">${v.title}</h3>
        <div class="grade">${gradeName(g)}</div>
        <div class="muted">得分 ${s} · ${style}笔 · ${placedToDesc()}</div>
        <div style="margin-top:10px" class="card">
          <div class="meta">声望 ${v.rep + (style === '直' ? 2 : -2) >= 0 ? '+' : ''}${v.rep + (style === '直' ? 2 : -2)} · 零花钱 +${v.money} · 文笔 +5<br>立传入册：${v.cast.map(id => (PEOPLE_BY_ID[id] || {}).name || id).join('、')}</div>
        </div>
        <button class="btn btn-primary" style="margin-top:14px" id="after-vol">看看传主反应</button>`;
      body.appendChild(verd);
      $('#after-vol').onclick = () => {
        UI.closePanel();
        const after = v.after || [{ who:'旁白', text:'卷成。' }];
        Dialog.play(after);
      };
    });
    placed = { qi: null, cheng: null, zhuan: null, he: null };
  }
  function placedToDesc() {
    return SLOT_KEYS.map(k => SHARDS[placed[k]] ? SHARDS[placed[k]].name : '').filter(Boolean).join(' / ');
  }

  return {
    open(no) {
      volNo = no;
      placed = { qi: null, cheng: null, zhuan: null, he: null };
      style = '直';
      render();
    },
    openPublished(no) { UI.viewVol(no); },
  };
})();

</script>
<script>
/* 实验史记·春秋笔 —— 小游戏：月考迟到 / 陀螺 / 食堂冲刺 / 乒乓球 */
'use strict';

const MG = (() => {
  const root = $('#minigame'), cv = $('#mg-canvas'), hud = $('#mg-hud');
  const ctx = cv.getContext('2d');
  const W = 760, H = 540;
  let cur = null, raf = 0, last = 0, onEnd = null, ended = false;

  function setup() {
    const d = Math.min(window.innerWidth / W, window.innerHeight / H, 1);
    cv.width = W; cv.height = H;
    cv.style.width = W * d + 'px'; cv.style.height = H * d + 'px';
  }
  function end(success) {
    if (ended) return; ended = true;
    cancelAnimationFrame(raf);
    setTimeout(() => { root.classList.add('hidden'); const cb = onEnd; onEnd = null; cur = null; cb && cb(success); }, 900);
  }
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (cur) { cur.update(dt); cur.draw(ctx); }
    if (!ended) raf = requestAnimationFrame(loop);
  }
  function bg() {
    ctx.fillStyle = '#f4efe0'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(60,55,40,.06)';
    for (let y = 0; y < H; y += 26) ctx.fillRect(0, y, W, 1);
  }
  function txt(s, x, y, size, color, font, align) {
    ctx.fillStyle = color || '#26241f';
    ctx.font = `${size}px ${font || 'serif'}`;
    ctx.textAlign = align || 'center';
    ctx.fillText(s, x, y);
  }
  function button(x, y, w, h, label, hot) {
    ctx.fillStyle = hot ? '#b8432f' : '#fffdf5';
    roundRect(ctx, x, y, w, h, 12); ctx.fill();
    ctx.strokeStyle = hot ? '#8a2f1c' : 'rgba(0,0,0,.15)'; ctx.lineWidth = 1.5; ctx.stroke();
    txt(label, x + w / 2, y + h / 2 + 6, 17, hot ? '#fff6f0' : '#26241f', 'sans-serif');
    return { x, y, w, h };
  }
  const inBtn = (b, x, y) => b && x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h;
  cv.addEventListener('pointerdown', e => {
    if (!cur || !cur.point) return;
    const r = cv.getBoundingClientRect();
    const d = cv.width / r.width;
    cur.point(e.clientX - r.left, e.clientY - r.top, true);
  });

  /* ============ 1. 月考迟到 ============ */
  function gameLate() {
    let stage = 0, timer = 90, clicks = 0, wrongFlash = 0, msg = '';
    let btns = [];
    const stages = ['clock', 'lock', 'bag', 'room', 'number', 'done'];
    function fail(t) { msg = t; timer = Math.max(0, timer - 8); wrongFlash = 0.5; }
    return {
      update(dt) {
        if (stage < 5) { timer -= dt; wrongFlash = Math.max(0, wrongFlash - dt); }
        hud.textContent = `月考之晨 · 剩余 ${Math.ceil(timer)} 秒 · ${msg}`;
        if (timer <= 0 && stage < 5) {
          bg(); txt('钟声响时，你还在走廊里。', W / 2, H / 2 - 20, 30, '#b8432f');
          txt('（卒得109。除姓名外靡不毕缪。）', W / 2, H / 2 + 24, 19, '#5a564c');
          stage = 5; end(false);
        }
        if (stage === 5) end(true);
      },
      draw() {
        bg();
        txt('大展的清晨', W / 2, 52, 30, '#26241f');
        txt('── 七点五十五分，距离月考还有一切要办的事 ──', W / 2, 84, 15, '#8d887a', 'sans-serif');
        btns = [];
        const st = stages[stage];
        if (st === 'clock') {
          txt('① 逼视表', W / 2, 160, 20, '#b8432f');
          roundRect(ctx, W / 2 - 90, 200, 180, 180, 20); ctx.fillStyle = '#fffdf5'; ctx.fill();
          ctx.strokeStyle = '#26241f'; ctx.lineWidth = 3; ctx.stroke();
          const flip = clicks > 0;
          txt(flip ? '7:55' : '6:55', W / 2, 305, 52, flip ? '#b8432f' : '#26241f');
          txt(flip ? '大惊。' : '善，恰吾不欲上早读。（点一下再看）', W / 2, 420, 17, '#5a564c', 'sans-serif');
        } else if (st === 'lock') {
          txt('② 宿舍西大门的锁', W / 2, 160, 20, '#b8432f');
          txt('宿管说：此锁乃虚铁。', W / 2, 196, 16, '#5a564c', 'sans-serif');
          const open = clicks >= 3;
          txt(open ? '🔓 开了' : '🔒', W / 2, 300, clicks >= 3 ? 40 : 90);
          if (!open) txt(`点 3 下开锁（${clicks}/3）`, W / 2, 420, 17, '#5a564c', 'sans-serif');
          else txt('置锁于吾桌，尔便得出。', W / 2, 420, 17, '#5a564c', 'sans-serif');
        } else if (st === 'bag') {
          txt('③ 翻遍教室外的书包找笔', W / 2, 160, 20, '#b8432f');
          txt('准考证、笔俱在七班内。点一个书包：', W / 2, 196, 16, '#5a564c', 'sans-serif');
          const right = irand(0, 2);
          const got = clicks > 0;
          for (let i = 0; i < 3; i++) btns.push(button(120 + i * 180, 240, 140, 120, ['🎒 书包', '🎒 书包', '🎒 书包'][i], false));
          if (got) txt(clicks === right + 1 ? '可怡的一支黑笔！' : '没有笔……再找。', W / 2, 420, 18, clicks === right + 1 ? '#3e7a5e' : '#b8432f', 'sans-serif');
          if (got && clicks === right + 1) stage = 3;
        } else if (st === 'room') {
          txt('④ 找考场', W / 2, 160, 20, '#b8432f');
          txt('隐知己考场为 12、17。', W / 2, 196, 16, '#5a564c', 'sans-serif');
          if (clicks === 0) txt('（提示：试两次才知道真正在哪）', W / 2, 420, 15, '#8d887a', 'sans-serif');
          btns.push(button(140, 240, 140, 90, '17 考场', false));
          btns.push(button(310, 240, 140, 90, '12 考场', false));
          btns.push(button(480, 240, 140, 90, '19 考场', false));
          if (clicks === 1) txt('17：无有缺考者。', W / 2, 400, 17, '#5a564c', 'sans-serif');
          if (clicks === 2) { txt('12：恰有缺考者，入。——然吾之考场为 19 也。', W / 2, 400, 17, '#b8432f', 'sans-serif'); stage = 4; setTimeout(() => {}, 0); }
        } else if (st === 'number') {
          txt('⑤ 考号', W / 2, 160, 20, '#b8432f');
          txt('监考员给了你一张 22058 的准考证格式。', W / 2, 200, 16, '#5a564c', 'sans-serif');
          btns.push(button(170, 260, 200, 80, '凭记忆填上', false));
          btns.push(button(400, 260, 200, 80, '空着不填', false));
          txt('（原典：不知考号，卒未填。然考号实未变也。）', W / 2, 400, 15, '#8d887a', 'sans-serif');
        }
        if (wrongFlash > 0) { ctx.fillStyle = `rgba(184,67,47,${wrongFlash * 0.3})`; ctx.fillRect(0, 0, W, H); }
      },
      point(x, y) {
        const st = stages[stage];
        if (st === 'clock') { clicks++; if (clicks >= 2) { stage = 1; clicks = 0; } }
        else if (st === 'lock') { clicks++; if (clicks >= 3) { stage = 2; clicks = 0; } }
        else if (st === 'bag') {
          for (let i = 0; i < 3; i++) if (inBtn(btns[i], x, y)) {
            if (i === clicks % 3) { msg = '可怡的一支黑笔！'; stage = 3; }
            else fail('翻错了书包');
          }
        } else if (st === 'room') {
          if (clicks === 0 && inBtn(btns[0], x, y)) { clicks = 1; msg = '17：无有缺考者。'; }
          else if (clicks === 1 && inBtn(btns[1], x, y)) { clicks = 2; stage = 4; }
          else fail('不是这个考场');
        } else if (st === 'number') {
          if (inBtn(btns[0], x, y)) fail('填错考号，靡不毕缪');
          else if (inBtn(btns[1], x, y)) { stage = 5; end(true); }
        }
      },
    };
  }

  /* ============ 2. 陀螺·三溴化氮 ============ */
  function gameSpin() {
    const P = { x: W * 0.3, y: H * 0.6, vx: 0, vy: 0, e: 100, r: 26, ang: 0 };
    const E = { x: W * 0.7, y: H * 0.4, vx: 0, vy: 0, e: 100, r: 26, ang: 0 };
    let charging = false, charge = 0, over = 0, tipp = 0;
    function launch() {
      const dx = E.x - P.x, dy = E.y - P.y, d = Math.hypot(dx, dy);
      const v = 260 + charge * 320;
      P.vx = dx / d * v; P.vy = dy / d * v;
    }
    return {
      update(dt) {
        if (charging) charge = Math.min(1, charge + dt * 1.4);
        if (over) { tipp += dt; if (tipp > 0.9) end(over === 1); return; }
        [P, E].forEach((t, i) => {
          t.x += t.vx * dt; t.y += t.vy * dt;
          t.vx *= (1 - 1.1 * dt); t.vy *= (1 - 1.1 * dt);
          if (t.x < 40 + t.r) { t.x = 40 + t.r; t.vx = Math.abs(t.vx) * 0.7; }
          if (t.x > W - 40 - t.r) { t.x = W - 40 - t.r; t.vx = -Math.abs(t.vx) * 0.7; }
          if (t.y < 90 + t.r) { t.y = 90 + t.r; t.vy = Math.abs(t.vy) * 0.7; }
          if (t.y > H - 40 - t.r) { t.y = H - 40 - t.r; t.vy = -Math.abs(t.vy) * 0.7; }
          t.e -= dt * (5.2 - i * 0.4);
          t.ang += (Math.hypot(t.vx, t.vy) * 0.02 + 6) * dt * 10;
        });
        const dx = E.x - P.x, dy = E.y - P.y, d = Math.hypot(dx, dy);
        if (d < P.r + E.r) {
          const nx = dx / d, ny = dy / d;
          const rel = Math.abs(P.vx - E.vx) + Math.abs(P.vy - E.vy);
          const imp = 0.10;
          P.e -= rel * imp; E.e -= rel * imp * 1.15;
          const tm = (P.vx * nx + P.vy * ny), te = (E.vx * nx + E.vy * ny);
          P.vx += nx * Math.max(120, rel * 0.5) - nx * tm; P.vy += ny * Math.max(120, rel * 0.5) - ny * tm;
          E.vx -= nx * Math.max(120, rel * 0.5) - nx * te; E.vy -= ny * Math.max(120, rel * 0.5) - ny * te;
          Sfx.tap();
        }
        if (P.e <= 0) over = 2; else if (E.e <= 0) over = 1;
        hud.textContent = `三溴化氮之战 · 你 ${Math.max(0, P.e | 0)} ─ ${Math.max(0, E.e | 0)} 头哥`;
      },
      draw() {
        bg();
        ctx.fillStyle = '#d9cfb4'; ctx.beginPath(); ctx.ellipse(W / 2, H / 2 + 30, W / 2 - 30, H / 2 - 70, 0, 0, 7); ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,.1)'; ctx.stroke();
        [[P, '#41608c', '你'], [E, '#8a4a2f', '三溴化氮']].forEach(([t, col, name]) => {
          ctx.save(); ctx.translate(t.x, t.y);
          ctx.fillStyle = 'rgba(30,26,16,.2)'; ctx.beginPath(); ctx.ellipse(0, 10, t.r, 8, 0, 0, 7); ctx.fill();
          ctx.rotate(t.ang);
          ctx.fillStyle = col; roundRect(ctx, -t.r, -6, t.r * 2, 12, 6); ctx.fill();
          ctx.rotate(Math.PI / 3);
          roundRect(ctx, -t.r, -6, t.r * 2, 12, 6); ctx.fill();
          ctx.restore();
          txt(name, t.x, t.y - 34, 14, '#403a2e', 'sans-serif');
        });
        if (!over) {
          if (charging) {
            ctx.fillStyle = '#fffdf5'; roundRect(ctx, W / 2 - 130, H - 70, 260, 26, 13); ctx.fill();
            ctx.fillStyle = '#b8432f'; roundRect(ctx, W / 2 - 126, H - 66, 252 * charge, 18, 9); ctx.fill();
            txt('蓄力中……松手发射！', W / 2, H - 86, 15, '#b8432f', 'sans-serif');
          } else if (charge === 0 && Math.hypot(P.vx, P.vy) < 10) {
            txt('按住蓄力，松手发射，撞飞三溴化氮！', W / 2, H - 60, 16, '#5a564c', 'sans-serif');
            txt('（碰撞后可继续点击追击）', W / 2, H - 36, 13, '#8d887a', 'sans-serif');
          }
        } else {
          ctx.fillStyle = 'rgba(244,239,224,.75)'; ctx.fillRect(0, 0, W, H);
          txt(over === 1 ? '三溴化氮，倒了！' : '你的陀螺先停了……', W / 2, H / 2, 34, over === 1 ? '#3e7a5e' : '#b8432f');
        }
      },
      point(x, y, down) {
        if (over) return;
        if (down) {
          if (!charging && Math.hypot(P.vx, P.vy) < 30) { charging = true; charge = 0; }
        } else if (charging) {
          charging = false; launch();
          Sfx.seal();
          setTimeout(() => { charge = 0; }, 100);
        }
      },
      onUp: true,
    };
  }

  /* ============ 3. 食堂冲刺 ============ */
  function gameCanteen() {
    let lane = 1, dist = 0, time = 0, over = 0, stumble = 0, speed = 210;
    let obs = []; let nextSpawn = 0.5;
    const laneX = [W * 0.3, W * 0.5, W * 0.7];
    const goal = 2600;
    return {
      update(dt) {
        if (over) { over += dt; if (over > 1) end(dist >= goal); return; }
        time += dt; stumble = Math.max(0, stumble - dt);
        speed = 210 + time * 6;
        dist += stumble > 0 ? speed * 0.25 * dt : speed * dt;
        nextSpawn -= dt;
        if (nextSpawn <= 0) {
          nextSpawn = rand(0.45, 0.85);
          const l = irand(0, 2);
          obs.push({ lane: l, y: -40, hit: false });
          if (Math.random() < 0.4) { let l2 = (l + irand(1, 2)) % 3; obs.push({ lane: l2, y: -40 - rand(30, 90), hit: false }); }
        }
        obs.forEach(o => o.y += speed * dt * 1.15);
        obs = obs.filter(o => o.y < H + 60);
        obs.forEach(o => {
          if (!o.hit && o.lane === lane && Math.abs(o.y - (H - 110)) < 34) {
            o.hit = true; stumble = 1.4; Sfx.bad();
          }
        });
        hud.textContent = `羚羊奔食 · ${Math.max(0, (goal - dist) | 0)} 步到窗口${stumble > 0 ? ' · 踉跄！' : ''}`;
        if (dist >= goal) over = 0.001;
        if (time > 40) { over = 0.001; dist = 0; }
      },
      draw() {
        bg();
        // 走廊三线
        for (let i = 0; i < 3; i++) {
          ctx.fillStyle = i % 2 ? '#e7dcc2' : '#e2d6ba';
          ctx.fillRect(W / 3 * i, 70, W / 3, H - 110);
        }
        ctx.fillStyle = '#c9b389'; ctx.fillRect(0, 40, W, 30);
        txt('食堂打饭窗口 ↑', W / 2, 62, 15, '#6a5a3a', 'sans-serif');
        // 障碍（同学）
        obs.forEach(o => {
          const x = laneX[o.lane], y = o.y;
          drawAvatar(ctx, { look: { hair: pick(['#2a2620', '#3a3020', '#1c1812']), style: pick(['short', 'flat', 'bob']) }, role: 's', cls: '6' }, x, y, 52);
        });
        // 玩家（羚羊）
        const px = laneX[lane], py = H - 110;
        ctx.save();
        ctx.translate(px, py + Math.sin(time * 22) * (stumble > 0 ? 5 : 2.5));
        drawAvatar(ctx, { look: { hair: '#191612', style: 'short', acc: '🏃' }, role: 's', cls: '8' }, 0, 0, 58);
        ctx.restore();
        // 进度条
        ctx.fillStyle = '#fffdf5'; roundRect(ctx, W / 2 - 150, H - 28, 300, 14, 7); ctx.fill();
        ctx.fillStyle = '#b8432f'; roundRect(ctx, W / 2 - 147, H - 25, 294 * clamp(dist / goal, 0, 1), 8, 4); ctx.fill();
        if (over) {
          ctx.fillStyle = 'rgba(244,239,224,.75)'; ctx.fillRect(0, 0, W, H);
          txt(dist >= goal ? '先以右足探地——第一！' : '队伍排到了门口……', W / 2, H / 2, 32, dist >= goal ? '#3e7a5e' : '#b8432f');
        } else txt('点击左右半边（或 ← →）换线躲人', W / 2, H - 48, 14, '#8d887a', 'sans-serif');
      },
      point(x, y) {
        if (over || x < 0) return;
        if (x < W / 2 && lane > 0) { lane--; Sfx.chat(); }
        else if (x >= W / 2 && lane < 2) { lane++; Sfx.chat(); }
      },
      key(k) {
        if (k === 'ArrowLeft' && lane > 0) lane--;
        if (k === 'ArrowRight' && lane < 2) lane++;
      },
    };
  }

  /* ============ 4. 乒乓球二十板 ============ */
  function gamePingpong() {
    let hits = 0, pos = 0, dir = 1, speed = 0.55, zoneC = rand(0.3, 0.7), zoneW = 0.16, over = 0, label = '正手';
    function hitZone() { return { a: clamp(zoneC - zoneW, 0, 1), b: clamp(zoneC + zoneW, 0, 1) }; }
    return {
      update(dt) {
        if (over) { over += dt; if (over > 1.1) end(hits >= 20); return; }
        pos += dir * speed * dt;
        if (pos > 1) { pos = 1; dir = -1; }
        if (pos < 0) { pos = 0; dir = 1; }
        speed = 0.55 + hits * 0.028;
        hud.textContent = `乒乓球期末 · ${hits} / 20 板 · 本拍：${label}${hits === 16 ? '（差四板！）' : ''}`;
      },
      draw() {
        bg();
        txt('反手与正手，凡三度，每度须满二十板。', W / 2, 70, 18, '#26241f');
        txt(`当前 ${hits} 板（至多十六板？）`, W / 2, 104, 15, '#8d887a', 'sans-serif');
        // 球台
        ctx.fillStyle = '#3e7a5e'; roundRect(ctx, W / 2 - 260, 330, 520, 150, 10); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(W / 2, 330); ctx.lineTo(W / 2, 480); ctx.stroke();
        // 计时条
        ctx.fillStyle = '#fffdf5'; roundRect(ctx, W / 2 - 240, 210, 480, 40, 20); ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,.15)'; ctx.stroke();
        const z = hitZone();
        ctx.fillStyle = '#b8432f33'; roundRect(ctx, W / 2 - 240 + 480 * z.a, 210, 480 * (z.b - z.a), 40, 12); ctx.fill();
        ctx.fillStyle = '#26241f'; ctx.beginPath(); ctx.arc(W / 2 - 240 + 480 * pos, 230, 12, 0, 7); ctx.fill();
        txt(`这一板用「${label}」`, W / 2, 190, 17, '#b8432f');
        // 球拍示意
        ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.arc(W / 2 - 240 + 480 * pos, 285, 22, 0, 7); ctx.fill();
        ctx.fillStyle = '#d9b48a'; ctx.fillRect(W / 2 - 240 + 480 * pos - 4, 292, 8, 30);
        if (over) {
          ctx.fillStyle = 'rgba(244,239,224,.78)'; ctx.fillRect(0, 0, W, H);
          txt(hits >= 20 ? '二十板，成！' : '球又不过网……', W / 2, H / 2 - 10, 34, hits >= 20 ? '#3e7a5e' : '#b8432f');
          if (hits >= 20) txt('（师长亦大惊：吾一直以为尔在陪对面。）', W / 2, H / 2 + 30, 16, '#5a564c');
        } else txt('光标进入红区时点击（或按空格）回球', W / 2, H - 46, 14, '#8d887a', 'sans-serif');
      },
      swing() {
        if (over) return;
        const z = hitZone();
        if (pos >= z.a && pos <= z.b) {
          hits++; Sfx.good();
          zoneC = rand(0.22, 0.78);
          label = hits % 2 ? '反手' : '正手';
          if (hits === 8) label = '——等等，这是正手还是反手？';
          if (hits === 13) label = '师长：吾以为尔在陪对面';
        } else { hits = 0; Sfx.bad(); label = '正手'; }
      },
      point() { if (this._lastUp) return; this.swing(); },
    };
  }

  const GAMES = { late: gameLate, spin: gameSpin, canteen: gameCanteen, pingpong: gamePingpong };
  window.addEventListener('keydown', e => {
    if (!cur || !cur.key) return;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') cur.key(e.key);
    if (e.key === ' ' && cur.swing) { e.preventDefault(); cur.swing(); }
  });
  window.addEventListener('pointerup', e => { if (cur && cur.onUp) cur.point(-1, -1, false); });

  return {
    get active() { return !!cur; },
    launch(kind, onDone) {
      if (!GAMES[kind]) { onDone && onDone(true); return; }
      setup(); ended = false; onEnd = onDone;
      cur = GAMES[kind]();
      root.classList.remove('hidden');
      hud.textContent = '';
      last = performance.now();
      cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
    },
  };
})();

</script>
<script>
/* 实验史记·春秋笔 —— UI：HUD / 面板 / 图鉴 / 成就 / 设置 */
'use strict';

const UI = (() => {
  const panel = $('#panel'), scrim = $('#scrim');
  let panelOpen = false, onPanelClose = null;

  function openPanel(title, build) {
    $('#panel-title').textContent = title;
    const body = $('#panel-body');
    body.innerHTML = '';
    build(body);
    panel.classList.remove('hidden');
    scrim.classList.remove('hidden');
    SheetFX.open(panel);
    panelOpen = true;
    Sfx.page();
  }
  function closePanel() {
    if (!panelOpen) return;
    panelOpen = false;
    SheetFX.close(panel, () => {});
    scrim.classList.add('hidden');
    const cb = onPanelClose; onPanelClose = null; cb && cb();
    setTimeout(flushToasts, 150);
  }
  $('#panel-close').onclick = closePanel;
  scrim.addEventListener('click', closePanel);

  function bump(stat) {
    const elx = $('#hud-' + stat + '-v');
    const chip = $('#hud-' + stat);
    if (!elx) return;
    elx.textContent = stat === 'ap' ? G.ap : G[stat === 'wen' ? 'wen' : stat === 'rep' ? 'rep' : 'money'];
    chip.classList.remove('bump'); void chip.offsetWidth; chip.classList.add('bump');
  }
  function updateHUD() {
    $('#hud-date-main').textContent = Engine.dateLabel();
    $('#hud-period').textContent = PERIOD_LABEL[Engine.period()];
    $('#hud-ap-v').textContent = G.ap;
    $('#hud-wen-v').textContent = G.wen;
    $('#hud-rep-v').textContent = G.rep;
    $('#hud-money-v').textContent = G.money;
    document.body.classList.remove('theme-morning', 'theme-day', 'theme-night');
    document.body.classList.add(PERIOD_THEME[Engine.period()]);
  }
  function renderPlaces() {
    const bar = $('#placelist');
    bar.innerHTML = '';
    SCENES.forEach(s => {
      const known = G.flags.visitedScenes.includes(s.id) || true; // 全开放，鼓励探索
      const b = el('button', 'place-btn' + (s.id === World.sceneId ? ' here' : ''), s.short);
      b.onclick = () => { if (s.id !== World.sceneId && !Dialog.active) World.travel(s.id); UI.closePanel(); };
      bar.appendChild(b);
    });
  }
  function renderHearsay() {
    const list = $('#hearsay-list');
    if (!list) return;
    list.innerHTML = '';
    const evs = Engine.eventsToday();
    if (evs.length) {
      evs.slice(0, 4).forEach(ev => {
        const done = G.doneEvents.includes(ev.id);
        const d = el('div', 'hearsay-item');
        d.innerHTML = `<b>${ev.name}</b> · ${SCENE_BY_ID[ev.scene].short} ${done ? '<span class="done">已记</span>' : ''}`;
        list.appendChild(d);
      });
    }
    const missed = Engine.missedEvents();
    if (missed.length) {
      const d = el('div', 'hearsay-item');
      d.innerHTML = `<b>${missed.length} 条错过的史料</b>可打听（史记页查看）`;
      d.style.cursor = 'pointer';
      d.onclick = () => { UI.closePanel(); UI.panelBook('gossip'); };
      list.appendChild(d);
    }
    if (!evs.length && !missed.length) list.innerHTML = '<div class="hearsay-item">今日风平浪静，宜读书访友。</div>';
  }
  function toastScene(name) { toast(name, '行'); }

  /* ============ 史记面板 ============ */
  function gradeName(g) { return { 4:'神品', 3:'上品', 2:'中品', 1:'下品' }[g] || ''; }
  function panelBook(mode) {
    openPanel('史记 · 卷目', body => {
      const pub = Object.keys(G.vols).length;
      const head = el('div', '', `<div class="muted">已立 ${pub} / 15 卷 · 直笔 ${G.stats.direct} 次 · 曲笔 ${G.stats.curve} 次</div><div style="height:10px"></div>`);
      body.appendChild(head);
      VOLS.forEach(v => {
        const st = G.vols[v.no];
        const pool = Object.keys(SHARDS).filter(id => SHARDS[id].vol === v.no);
        const owned = pool.filter(s => G.shards[s]).length;
        const row = el('div', 'vol-row' + (st ? '' : owned ? '' : ' locked'));
        const right = st ? `<span class="vol-grade g${st.grade}">${gradeName(st.grade)}</span>`
          : `<span class="muted">${owned}/${pool.length} 料</span>`;
        row.innerHTML = `<div class="vol-no">${v.i}</div>
          <div class="vol-name">${v.title}<small>${st ? `${st.style === '直' ? '直笔' : '曲笔'} · 得意 ${st.shards.length} 条` : `集 ${pool.length} 料取其四 · 文笔≥${v.minWen}`}</small>
          ${st ? '' : `<div class="progress-bar"><i style="width:${Math.round(owned / pool.length * 100)}%"></i></div>`}</div>${right}`;
        row.onclick = () => {
          if (st) viewVol(v.no);
          else if (owned >= 4) Writing.open(v.no);
          else {
            const missing = v.pool.filter(s => !G.shards[s]);
            toast(`还差 ${4 - owned} 条：「${missing.slice(0, 3).map(s => SHARDS[s].name).join('」「')}」…`);
          }
        };
        body.appendChild(row);
      });
      // 打听区
      const missed = Engine.missedEvents();
      if (missed.length) {
        body.appendChild(el('div', '', '<div style="height:16px"></div><h3 style="font-family:var(--font-cl)">错过的史料 · 可打听</h3><div class="muted" style="margin-bottom:8px">花 1 行动点托人带话（需对方好感≥15），转述版文笔-1。</div>'));
        missed.forEach(ev => {
          const sh = SHARDS[ev.shard];
          if (G.shards[ev.shard]) return;
          const from = PEOPLE_BY_ID[ev.cast[0]];
          const row = el('div', 'vol-row');
          row.innerHTML = `<div class="vol-no">询</div><div class="vol-name">${sh.name}<small>向 ${from ? from.hao || from.name : '知情人'} 打听 · 好感 ${from ? Engine.favorOf(from.id) : 0}/15</small></div>
            <span class="pill ${Engine.favorOf(ev.cast[0]) >= 15 ? 'jade' : 'gray'}">${Engine.favorOf(ev.cast[0]) >= 15 ? '可打听' : '好感不足'}</span>`;
          row.onclick = () => {
            if (Engine.favorOf(ev.cast[0]) < 15) { toast('好感不足，他不肯多说'); return; }
            if (!Engine.spendAP(1)) return;
            Engine.grantShard(ev.shard, 'gossip');
            G.stats.gossip++;
            if (G.stats.gossip >= 8) Engine.award('ach_gossip');
            Engine.addFavor(ev.cast[0], 1);
            UI.closePanel(); UI.panelBook('gossip'); UI.renderHearsay();
          };
          body.appendChild(row);
        });
      }
    });
  }
  function viewVol(no) {
    const v = VOL_BY_NO[no], st = G.vols[no];
    openPanel(`${v.title}（${v.i}）`, body => {
      const wrap = el('div', 'card');
      wrap.style.fontFamily = 'var(--font-cl)';
      wrap.innerHTML = `<div class="muted" style="text-align:center;letter-spacing:.4em">实 验 史 记</div>
        <h3 style="text-align:center;font-size:19px;margin:6px 0 10px">${v.title} 第${v.i}</h3>
        ${st.shards.map(id => `<p style="font-size:14.5px;line-height:1.9;margin:8px 0">${SHARDS[id].text}</p>`).join('')}
        <p style="font-size:14.5px;line-height:1.9;margin:10px 0 4px;color:var(--cinnabar)">音克思曰：${SHARDS[st.shards[st.shards.length-1]].text.replace(/^音克思曰：/, '')}</p>
        <div style="text-align:right;margin-top:8px"><span class="vol-grade g${st.grade}">${gradeName(st.grade)} · ${st.style}笔</span></div>`;
      body.appendChild(wrap);
    });
  }

  /* ============ 图鉴 ============ */
  function panelCodex() {
    openPanel('图鉴 · 史中人', body => {
      const grid = el('div', 'pgrid');
      const all = PEOPLE.concat(PEOPLE_WAI);
      all.forEach(p => {
        const volNo = p.vol ? VOLS.find(v => v.no === p.vol) : null;
        const published = p.vol && G.vols[p.vol];
        const met = G.flags.metPeople.includes(p.id);
        const card = el('div', 'card pcard');
        card.appendChild(World.avatarCanvas(p, 56));
        const info = el('div', '');
        info.innerHTML = `<div class="pname">${met || published ? p.name : '？？？'}<span class="phao">${met || published ? (p.hao || '') : '未识'}</span></div>
          <div class="pbio">${published ? p.bio : met ? p.intro + '<br><span class="muted">立传后解锁全文小传。</span>' : '尚未结识。多去校园里走走。'}</div>
          ${published && p.quote ? `<div class="pquote">${p.quote}</div>` : ''}
          ${met && !published ? `<div class="muted" style="margin-top:4px">好感 ${Engine.favorOf(p.id)}${p.interview ? Engine.hasShard(p.interview.give) ? ' · 已采访' : ' · 30 可采访' : ''}</div>` : ''}`;
        card.appendChild(info);
        grid.appendChild(card);
      });
      body.appendChild(grid);
    });
  }

  /* ============ 行囊 ============ */
  function panelBag() {
    openPanel('行囊', body => {
      const ids = Object.keys(G.bag).filter(k => G.bag[k] > 0);
      if (!ids.length) { body.appendChild(el('div', 'muted', '空空如也。小卖部有售。')); return; }
      ids.forEach(id => {
        const it = ITEM_BY_ID[id];
        const c = el('div', 'card');
        c.innerHTML = `<h3>${it.name} <span class="pill gray">×${G.bag[id]}</span></h3><div class="meta">${it.desc}</div>`;
        body.appendChild(c);
      });
    });
  }

  /* ============ 小卖部 ============ */
  function panelShop() {
    openPanel('小卖部', body => {
      body.appendChild(el('div', 'muted', `零花钱 ◉${G.money} · 买东西送人，好感是采访与打听的本钱。`));
      body.appendChild(el('div', '', '<div style="height:8px"></div>'));
      ITEMS.forEach(it => {
        const c = el('div', 'card');
        c.style.display = 'flex'; c.style.alignItems = 'center'; c.style.gap = '12px';
        c.innerHTML = `<div style="flex:1"><h3 style="margin:0">${it.name} <span class="pill gold">◉${it.price}</span></h3><div class="meta">${it.desc}</div></div>`;
        const b = el('button', 'btn', '买');
        b.style.padding = '8px 18px';
        b.disabled = G.money < it.price;
        b.onclick = () => {
          if (G.money < it.price) return;
          Engine.addMoney(-it.price);
          G.bag[it.id] = (G.bag[it.id] || 0) + 1;
          Sfx.good(); toast(`购得「${it.name}」`, '购');
          Save.write(); UI.closePanel(); UI.panelShop();
        };
        c.appendChild(b);
        body.appendChild(c);
      });
    });
  }

  /* ============ 成就 ============ */
  function panelAch() {
    openPanel('成就', body => {
      const got = ACHIEVEMENTS.filter(a => G.ach[a.id]).length;
      body.appendChild(el('div', 'muted', `${got} / ${ACHIEVEMENTS.length}`));
      body.appendChild(el('div', '', '<div style="height:8px"></div>'));
      const grid = el('div', 'ach-grid');
      ACHIEVEMENTS.forEach(a => {
        const c = el('div', 'card ach' + (G.ach[a.id] ? ' got' : ''));
        c.innerHTML = `<span class="aicon">${a.icon}</span><h3>${a.name}</h3><div class="meta">${a.desc}</div>`;
        grid.appendChild(c);
      });
      body.appendChild(grid);
    });
  }

  /* ============ 设置 ============ */
  function panelSettings() {
    openPanel('系统', body => {
      const mk = (label, segs, cur, cb) => {
        const row = el('div', 'setrow');
        row.appendChild(el('div', '', label));
        const w = el('div', 'segs');
        segs.forEach(s => {
          const b = el('button', 'seg' + (s.v === cur ? ' on' : ''), s.t);
          b.onclick = () => { cb(s.v); UI.closePanel(); UI.panelSettings(); };
          w.appendChild(b);
        });
        row.appendChild(w);
        body.appendChild(row);
      };
      mk('音效', [{ t:'开', v:false }, { t:'静音', v:true }], G.settings.muted, v => { G.settings.muted = v; });
      mk('打字速度', [{ t:'从容', v:1 }, { t:'风驰', v:2 }], G.settings.speed, v => { G.settings.speed = v; });
      body.appendChild(el('div', '', '<div style="height:14px"></div>'));
      const ex = el('div', 'card');
      ex.innerHTML = '<h3>导出存档</h3><div class="meta" style="margin-bottom:8px">换设备或清缓存前，把这串文字保存好。</div>';
      const ta1 = el('textarea', 'savebox'); ta1.readOnly = true; ta1.value = Save.export();
      ex.appendChild(ta1);
      const cb1 = el('button', 'btn', '复制到剪贴板'); cb1.style.marginTop = '8px';
      cb1.onclick = () => { ta1.select(); document.execCommand && document.execCommand('copy'); toast('已复制', '存'); };
      ex.appendChild(cb1);
      body.appendChild(ex);
      const im = el('div', 'card');
      im.innerHTML = '<h3>导入存档</h3><div class="meta" style="margin-bottom:8px">粘贴此前的存档文字。</div>';
      const ta2 = el('textarea', 'savebox'); ta2.placeholder = '粘贴到此处…';
      im.appendChild(ta2);
      const cb2 = el('button', 'btn btn-primary', '导入并重载'); cb2.style.marginTop = '8px';
      cb2.onclick = () => {
        try { Save.import(ta2.value); location.reload(); }
        catch (e) { toast('存档格式不对'); }
      };
      im.appendChild(cb2);
      body.appendChild(im);
      const rs = el('div', 'card');
      const cb3 = el('button', 'btn', '重开一局（清除存档）');
      cb3.onclick = () => {
        confirmBox('重开将清除当前全部进度，确定？', () => { Save.clear(); location.reload(); });
      };
      rs.appendChild(cb3);
      body.appendChild(rs);
      body.appendChild(el('div', 'muted', '<div style="height:14px"></div>据 音克思《实验史记》改编。文言引文皆出自原文。'));
    });
  }

  /* ============ 确认框 ============ */
  function confirmBox(text, onYes) {
    const w = el('div');
    w.style.cssText = 'position:fixed;inset:0;z-index:95;display:grid;place-items:center;background:rgba(20,18,12,.4)';
    const card = el('div', 'card');
    card.style.cssText = 'width:min(340px,86vw);text-align:center';
    card.innerHTML = `<h3 style="margin-bottom:10px">${text}</h3>`;
    const row = el('div'); row.style.cssText = 'display:flex;gap:10px;justify-content:center';
    const yes = el('button', 'btn btn-primary', '确定');
    const no = el('button', 'btn', '再想想');
    yes.onclick = () => { w.remove(); onYes(); };
    no.onclick = () => w.remove();
    row.appendChild(yes); row.appendChild(no); card.appendChild(row); w.appendChild(card);
    document.body.appendChild(w);
  }

  return { openPanel, closePanel, bump, updateHUD, renderPlaces, renderHearsay, toastScene,
    panelBook, viewVol, panelCodex, panelBag, panelShop, panelAch, panelSettings, confirmBox,
    get panelOpen() { return panelOpen; }, set onClose(f) { onPanelClose = f; } };
})();

</script>
<script>
/* 实验史记·春秋笔 —— 主线流程：章节 / 交互 / 晚自习 / 终章 */
'use strict';

const Main = (() => {
  /* ---------- 标题页 ---------- */
  function bindTitle() {
    $('#btn-new').onclick = () => { Sfx.tap(); G = newGameState(); Save.write(); startChapter(true); };
    $('#btn-continue').onclick = () => {
      const s = Save.read();
      if (!s) { toast('还没有存档'); return; }
      G = s; Sfx.tap();
      $('#screen-title').classList.add('hidden');
      $('#screen-game').classList.remove('hidden');
      UI.updateHUD();
      World.enter(G.flags.lastScene || 'corridor');
      enterPeriod(false);
      toast('继续上局', '史');
    };
    $('#btn-import-title').onclick = () => {
      UI.openPanel('导入存档', body => {
        const ta = el('textarea', 'savebox'); ta.placeholder = '粘贴存档文字…';
        body.appendChild(ta);
        const b = el('button', 'btn btn-primary', '导入');
        b.style.marginTop = '8px';
        b.onclick = () => {
          try { Save.import(ta.value); location.reload(); }
          catch (e) { toast('存档格式不对'); }
        };
        body.appendChild(b);
      });
    };
    const has = !!Save.read();
    $('#btn-continue').classList.toggle('hidden', !has);
  }

  /* ---------- 章节卡 ---------- */
  function showChapterCard(def, cb) {
    const card = $('#chapter-card');
    $('#cc-date').textContent = def.date;
    $('#cc-title').textContent = def.title;
    $('#cc-sub').textContent = def.sub || '';
    card.classList.remove('hidden');
    Sfx.page();
    let fired = false;
    const done = () => {
      if (fired) return; // 点击与自动定时只会生效一次
      fired = true;
      card.classList.add('hidden'); card.onclick = null; cb && cb();
    };
    card.onclick = done;
    setTimeout(done, G.settings.motion === 'off' ? 1200 : 3000);
  }

  function startChapter(isNew) {
    const def = CHAPTERS[G.ch];
    $('#screen-title').classList.add('hidden');
    $('#screen-game').classList.remove('hidden');
    UI.updateHUD();
    showChapterCard(def, () => {
      const scene = def.scene || (G.ch === 15 ? 'gate' : 'corridor');
      World.enter(scene);
      if (isNew && G.ch === 0) prologue();
      else enterPeriod(true);
    });
  }

  function nextChapter() {
    if (G.ch >= CHAPTERS.length - 1) { finale(); return; }
    const toFinale = G.ch + 1 === CHAPTERS.length - 1; // 下一章即终章
    Engine.nextChapter();
    if (toFinale) { finale(); return; }
    startChapter(false);
  }

  /* ---------- 序章 ---------- */
  function prologue() {
    enterPeriod(true);
    toast('点击地面移动 · 走近带「记」的名场面旁观', '引');
    setTimeout(() => toast('右上「史记」随时翻阅卷目', '引'), 1800);
  }

  /* ---------- 时段流转 ---------- */
  function enterPeriod(changed) {
    UI.updateHUD();
    UI.renderPlaces();
    UI.renderHearsay();
    World.refresh();
    if (Engine.period() === 'eve') { /* 晚自习 ctx 由 updateCtx 处理 */ updateCtx(null); }
    else updateCtx(null);
    if (changed && Engine.period() === 'morning') toast(`${Engine.dateLabel()} · 早读铃响`, '晨');
  }
  function advancePeriod() {
    if (Dialog.active || MG.active || UI.panelOpen) return;
    const r = Engine.advancePeriod();
    if (r === 'period') { enterPeriod(true); Sfx.page(); }
    else if (r === 'eve') { enterPeriod(true); toast('晚自习——一日所获，可入史册', '夜'); Sfx.page(); }
  }
  function sleep() {
    if (Dialog.active || MG.active) return;
    const r = Engine.nextDay();
    if (r === 'chapter-end') {
      if (G.ch === 0) { Engine.award('ach_start'); }
      nextChapter();
    } else if (G.ch === CHAPTERS.length - 1 && G.day > CHAPTERS[G.ch].days) {
      finale();
    } else {
      enterPeriod(true);
      toast(`${Engine.dateLabel()}`, '晨');
    }
  }

  /* ---------- 交互条 ---------- */
  function updateCtx(near) {
    const bar = $('#ctxbar');
    bar.innerHTML = '';
    bar.classList.add('hidden');
    if (Dialog.active || MG.active) return;
    // 晚自习固定动作
    if (Engine.period() === 'eve') {
      bar.classList.remove('hidden');
      const mk = (t, cls, fn, dis) => { const b = el('button', 'ctx-btn' + (cls ? ' ' + cls : ''), t); b.disabled = !!dis; b.onclick = fn; bar.appendChild(b); return b; };
      mk('📖 撰史', '', () => UI.panelBook());
      mk('✒ 写日记', '', () => { Engine.addWen(3); G.flags.rested = true; toast('日记写成，文笔 +3；明日精神抖擞（行动点+1）', '文'); Save.write(); });
      mk('🌙 夜谈', '', nightTalk);
      mk('就寝 →', 'accent', sleep);
      return;
    }
    if (!near) return;
    bar.classList.remove('hidden');
    if (near.type === 'npc') {
      const p = near.p;
      const fav = Engine.favorOf(p.id);
      const head = el('span', 'ctx-name', p.hao || p.name);
      bar.appendChild(head);
      bar.appendChild(el('span', 'ctx-sub', `好感 ${fav}`));
      // 交谈
      const free = G.chatCount < 2;
      const chatBtn = el('button', 'ctx-btn', free ? '交谈' : '交谈 ⚡1');
      chatBtn.onclick = () => chat(p);
      bar.appendChild(chatBtn);
      // 赠礼
      const giftBtn = el('button', 'ctx-btn', G.giftToday[p.id] ? '已赠' : '赠礼');
      if (G.giftToday[p.id]) giftBtn.disabled = true;
      giftBtn.onclick = () => giftPick(p);
      bar.appendChild(giftBtn);
      // 采访
      if (p.interview) {
        const need = p.ivNeed != null ? p.ivNeed : 30;
        const ok = fav >= need && !Engine.hasShard(p.interview.give);
        const iv = el('button', 'ctx-btn' + (ok ? ' accent' : ''), ok ? '采访 ⚡1' : fav >= need ? '已采' : `采访 需好感${need}`);
        if (!ok) iv.disabled = true;
        iv.onclick = () => interview(p);
        bar.appendChild(iv);
      }
    } else if (near.type === 'event') {
      bar.appendChild(el('span', 'ctx-name', '「' + near.ev.name + '」'));
      const b = el('button', 'ctx-btn accent', '旁观亲历');
      b.onclick = () => playEvent(near.ev);
      bar.appendChild(b);
    } else if (near.type === 'door') {
      const b = el('button', 'ctx-btn', '进入 · ' + near.door.label);
      b.onclick = () => World.travel(near.door.to);
      bar.appendChild(b);
    }
    // 场景特有动作
    if (World.sceneId === 'library') {
      const b = el('button', 'ctx-btn', '读书 ⚡1 → 文笔+4');
      b.onclick = () => {
        if (!Engine.spendAP(1)) return;
        Engine.addWen(4); G.stats.reads++; Sfx.good();
        toast('读罢掩卷，文笔 +4', '文');
        if (Math.random() < 0.3) toast('（文言书看起来就是很上头）');
        Save.write();
      };
      bar.appendChild(b);
    }
    if ((World.sceneId === 'classroom6' || World.sceneId === 'classroom7') && (Engine.period() === 'morning' || Engine.period() === 'aft')) {
      const b = el('button', 'ctx-btn', '听课 ⚡1 → 文笔+2');
      b.onclick = () => listenClass();
      bar.appendChild(b);
    }
    if (World.sceneId === 'shop') {
      const b = el('button', 'ctx-btn accent', '进店购物');
      b.onclick = () => UI.panelShop();
      bar.appendChild(b);
    }
    if (World.sceneId === 'pingpong') {
      const b = el('button', 'ctx-btn', '打乒乓球 ⚡1');
      b.onclick = () => {
        if (!Engine.spendAP(1)) return;
        MG.launch('pingpong', ok => {
          if (ok) {
            Engine.award('ach_pp'); Engine.addWen(2); Engine.addMoney(5);
            if (!Engine.hasShard('sh_pingpong')) Engine.grantShard('sh_pingpong', 'scene');
            afterAction();
          } else { toast('差两板……再来一局？'); afterAction(); }
        });
      };
      bar.appendChild(b);
    }
  }

  function afterAction() {
    UI.updateHUD(); UI.renderHearsay(); World.refresh(); Save.write();
  }

  /* ---------- 行为 ---------- */
  function chat(p) {
    if (G.chatCount >= 2 && !Engine.spendAP(1)) return;
    G.chatCount++;
    G.stats.chats++;
    if (!G.flags.metPeople.includes(p.id)) { G.flags.metPeople.push(p.id); toast(`结识「${p.name}${p.hao ? ' · ' + p.hao : ''}」`, '识'); }
    const first = G.stats.chats === 1;
    const line = pick(first ? p.greet.concat(p.chat) : p.chat);
    Engine.addFavor(p.id, 1);
    if (Engine.riskCheck()) { Engine.caughtPlay(() => afterAction()); return; }
    Dialog.play([{ who: p.hao || p.name, text: line }], afterAction);
  }
  function giftPick(p) {
    const ids = Object.keys(G.bag).filter(k => G.bag[k] > 0);
    if (!ids.length) { toast('行囊空空——去小卖部买点礼物', '囊'); UI.panelShop(); return; }
    UI.openPanel(`赠礼予 ${p.hao || p.name}`, body => {
      body.appendChild(el('div', 'muted', '投其所好，好感大涨。每人每天可赠一次。'));
      body.appendChild(el('div', '', '<div style="height:8px"></div>'));
      ids.forEach(id => {
        const it = ITEM_BY_ID[id];
        const love = p.loves && p.loves.includes(id), like = p.likes && p.likes.includes(id);
        const c = el('div', 'card');
        c.style.cssText = 'display:flex;align-items:center;gap:12px;cursor:pointer';
        c.innerHTML = `<div style="flex:1"><h3 style="margin:0">${it.name} <span class="pill gray">×${G.bag[id]}</span>${love ? '<span class="pill">心头好</span>' : like ? '<span class="pill jade">会喜欢</span>' : ''}</h3><div class="meta">${it.desc}</div></div>`;
        const b = el('button', 'btn btn-primary', '赠');
        b.onclick = e => { e.stopPropagation(); doGift(p, id); };
        c.appendChild(b);
        body.appendChild(c);
      });
    });
  }
  function doGift(p, id) {
    G.bag[id]--;
    G.giftToday[p.id] = 1;
    G.stats.gifts++;
    const love = p.loves && p.loves.includes(id), like = p.likes && p.likes.includes(id);
    const n = love ? 12 : like ? 6 : 2;
    Engine.addFavor(p.id, n);
    if (love) Sfx.unlock(); else Sfx.good();
    if (p.id === 'keyi' && Engine.favorOf(p.id) >= 100) Engine.award('ach_sugar');
    if (G.money >= 40) Engine.award('ach_rich');
    UI.closePanel();
    Dialog.play([{ who: p.hao || p.name, text: love ? `（眼睛一亮）此物……汝如何知吾所好？善！大善！` : like ? '（收下，端详片刻）有心了。' : '（收下）……多谢。' }], afterAction);
  }
  function interview(p) {
    if (!Engine.spendAP(1)) return;
    Engine.grantShard(p.interview.give, 'interview');
    Engine.addFavor(p.id, 5);
    Dialog.play(p.interview.script, afterAction);
  }
  function playEvent(ev) {
    Dialog.play(ev.script, () => {
      G.doneEvents.push(ev.id);
      // 亲历其事，当事人好感微增（不打扰，合并一条提示）
      if (ev.cast && ev.cast.length) {
        ev.cast.forEach(id => PEOPLE_BY_ID[id] && Engine.addFavorQuiet(id, 2));
        toast('亲历名场面，当事诸人好感 +2', '记');
      }
      if (ev.id === 'ev_shuban') Engine.award('ach_shuban');
      const mgStep = ev.script.find(s => s.mg);
      const mgOk = mgStep ? mgStep._mgResult !== false : true;
      if (ev.shard) {
        if (mgStep && !mgOk) { Engine.grantShard(ev.shard, 'gossip'); toast('过程有波折，但史料还是到手了'); }
        else Engine.grantShard(ev.shard, 'scene');
      }
      if (mgStep && mgOk) {
        if (ev.mg === 'late') Engine.award('ach_109');
        if (ev.mg === 'spin') Engine.award('ach_spin');
        if (ev.mg === 'canteen') Engine.award('ach_lingyang');
      }
      if (Engine.riskCheck()) { Engine.caughtPlay(() => afterAction()); return; }
      afterAction();
    });
  }
  function listenClass() {
    if (!Engine.spendAP(1)) return;
    Engine.addWen(2); G.stats.listened++;
    if (G.stats.listened >= 10) Engine.award('ach_listen');
    if (Math.random() < 0.22) {
      const t = World.sceneId === 'classroom6'
        ? ['zouyu', 'shibo', 'weirong'] : ['shenren', 'xiannv', 'touge'];
      const who = pick(t);
      Dialog.play([
        { who: PEOPLE_BY_ID[who].name, text: pick(['此题选A者乃神人也！', '尔来答之。', '奇彪无比！', '找交线——找垂线！']) },
        { choice: [
          { t:'举手作答', fx:'七成之数', run() {
              if (Math.random() < 0.7) { Engine.addRep(2); return { say:{who:'旁白',text:'答毕，满座称善。声望 +2'} }; }
              Engine.addRep(-1); return { say:{who:'旁白',text:'答错，哄堂大笑。'}, bad:true };
          } },
          { t:'低头装笔记', fx:'稳', run() { return { say:{who:'旁白',text:'你埋头猛写，笔走龙蛇——其实画的是史料框架。'} }; } },
        ] },
      ], afterAction);
      return;
    }
    toast('听课认真，文笔 +2', '文');
    afterAction();
  }
  function nightTalk() {
    const met = G.flags.metPeople.filter(id => PEOPLE_BY_ID[id]);
    if (Math.random() < 0.55 && met.length) {
      const id = pick(met);
      Engine.addFavor(id, 2);
      Dialog.play([{ who:'旁白', text:`熄灯后的卧谈会。话题不知怎么绕到了${PEOPLE_BY_ID[id].name}——你听了些新的传闻，好感 +2。` }], afterAction);
    } else {
      Dialog.play([{ who:'旁白', text:'卧谈话题从史记聊到高考，从高考聊到宇宙。什么都没记下来，但睡得很香。' }], afterAction);
    }
  }

  /* ---------- 世界回调 ---------- */
  function onCtxChange(near) { updateCtx(near); }
  function onNPC(p) {
    if (Dialog.active || MG.active) return;
    const pos = World.npcPos(p.id);
    if (pos) {
      const [px, py] = World.playerPos;
      if (Math.hypot(pos[0] - px, pos[1] - py) > 80) { World.walkTo(pos[0], pos[1] - 50); return; }
    }
    updateCtx({ type:'npc', p });
  }
  function onEvent(ev) {
    if (Dialog.active || MG.active) return;
    const [px, py] = World.playerPos;
    if (Math.hypot(ev.pos[0] - px, ev.pos[1] - py) > 80) { World.walkTo(ev.pos[0], ev.pos[1] + 30); return; }
    playEvent(ev);
  }
  function afterDialog() { UI.updateHUD(); UI.renderHearsay(); World.refresh(); Save.write(); }

  /* ---------- 终章：高考 · 毕业 · AI ---------- */
  function finale() {
    showChapterCard(CHAPTERS[16], () => {
      World.enter('gate');
      UI.updateHUD();
      Dialog.play([
        { who:'旁白', text:'六月七日。考场。你一抬眼——歆慧就坐在斜前方，大哥在她左后方。' },
        { who:'大哥', text:'（见之心善，探身）歆慧，汝亦在此。' },
        { who:'歆慧', text:'滚。' },
        { who:'旁白', text:'大哥于是遂走。开考铃响。' },
        { choice: [
          { t:'把这一幕原样记进心里', fx:'史官本能', rep:1, run(){ return { say:{who:'旁白',text:'你要让这一幕活过这个夏天。'} }; } },
          { t:'专心做卷子', fx:'考生本分', wen:2, run(){ return { say:{who:'旁白',text:'笔下如有神——这一场，你超常发挥。'} }; } },
        ] },
        { who:'旁白', text:'两日笔落如刀，收卷如史官封笔。后来听说，大哥托俊玥传了话，又亲口对歆慧说了三个字，歆慧对曰：善。' },
        { who:'旁白', text:'你忽然想起大哥的话：城墙者，高考也。你们都走完了那面墙。' },
      ], () => graduation());
    });
  }
  function graduation() {
    const all = PEOPLE.concat(PEOPLE_WAI);
    UI.openPanel('毕业 · 诸君去向', body => {
      body.appendChild(el('div', 'muted', '卷里卷外，皆是少年。你写下的每一个人，都有了自己的远方。'));
      body.appendChild(el('div', '', '<div style="height:10px"></div>'));
      all.forEach(p => {
        const met = G.flags.metPeople.includes(p.id) || (p.vol && G.vols[p.vol]);
        const c = el('div', 'card');
        c.style.marginBottom = '8px';
        c.innerHTML = `<h3 style="margin:0">${p.name} <span class="phao" style="color:var(--cinnabar);font-size:12.5px">${p.hao || ''}</span></h3>
          <div class="meta">${met ? p.out || '' : '（你在史书里没来得及写他/她。）'}</div>`;
        body.appendChild(c);
      });
      const b = el('button', 'btn btn-primary', '一年后……');
      b.style.cssText = 'width:100%;margin-top:12px;padding:14px';
      b.onclick = () => { UI.closePanel(); aiEpilogue(); };
      body.appendChild(b);
    });
  }
  function aiEpilogue() {
    Engine.award('ach_ai');
    const pub = Object.keys(G.vols).length;
    const avg = pub ? Object.values(G.vols).reduce((a, b) => a + b.grade, 0) / pub : 0;
    let title = '残卷 · 史未成而人已散';
    if (pub >= 6) title = '史官 · 有所记，有所失';
    if (pub >= 10) title = '良史 · 秉笔直书，温润如玉';
    if (pub >= 15) title = G.rep >= 60 ? '太史公 · 究天人之际，通古今之变' : '太史公（孤本）· 书成而友尽？';
    const styleLine = G.stats.direct > G.stats.curve * 2 ? '峻直' : G.stats.curve > G.stats.direct * 2 ? '敦厚' : '直曲相济';
    // 已立传诸人的平均好感
    const castIds = new Set();
    Object.keys(G.vols).forEach(no => VOL_BY_NO[no].cast.forEach(id => castIds.add(id)));
    const favAvg = castIds.size ? Math.round([...castIds].reduce((a, id) => a + Engine.favorOf(id), 0) / castIds.size) : 0;
    UI.openPanel('一年后 · AI 读史', body => {
      const card = el('div', 'card');
      card.style.fontFamily = 'var(--font-ui)';
      card.innerHTML = `
        <h3 style="font-size:18px">你把《实验史记》喂给了一个 AI。</h3>
        <div class="muted" style="margin-bottom:10px">——序云：「我想看看史记到底能不能看出我。」</div>
        <p style="font-size:14px;line-height:1.9">AI 读完了。它说：</p>
        <p style="font-size:14px;line-height:1.9">「全书立传 <b>${pub}/15</b> 卷，笔风<b>${styleLine}</b>（直笔 ${G.stats.direct} 处，曲笔 ${G.stats.curve} 处）。</p>
        <p style="font-size:14px;line-height:1.9">「书中诸人的平均好感 ${favAvg}/100，你在班中的声望 ${G.rep}/100——${G.rep >= 60 ? '你写作时显然没有失去太多朋友，这很了不起。' : '史官从来不好当，你得罪了一些人，但你没有删掉一个字。'}</p>
        <p style="font-size:14px;line-height:1.9">「最打动我的是：${pick(['你记录他们时，从未居高临下。', '你把小事故写成了大历史，又把大历史写得像小事。', '书里没有反派，只有没来得及好好说话的少年。'])}。</p>
        <p style="font-size:14px;line-height:1.9">「通过一个人的文字，真的能看出一个人的大部分。」</p>
        <div style="text-align:center;margin:18px 0 4px">
          <div style="font-family:var(--font-cl);font-size:30px;font-weight:900;color:var(--cinnabar)">${title}</div>
        </div>
        <button class="btn btn-primary" style="width:100%;padding:14px" id="btn-replay">重开重开</button>`;
      body.appendChild(card);
      $('#btn-replay').onclick = () => { Save.clear(); location.reload(); };
    });
    Sfx.unlock();
  }

  /* ---------- 菜单面板 ---------- */
  function menuPanel() {
    UI.openPanel('系统', body => {
      const row = el('div', '');
      row.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px';
      [['图鉴 · 史中人', () => UI.panelCodex()], ['成就', () => UI.panelAch()],
       ['行囊', () => UI.panelBag()], ['设置 · 存档', () => UI.panelSettings()]].forEach(([t, fn]) => {
        const b = el('button', 'btn', t);
        b.onclick = fn;
        row.appendChild(b);
      });
      body.appendChild(row);
      body.appendChild(el('div', 'card', `<h3>操作</h3><div class="meta">点击地面移动 / 点击人物交谈 / 走近「记」旁观名场面。底部按钮可直达各处。误触不怕——没有不可撤销的损失。</div>`));
    });
  }

  /* ---------- 全局按钮 ---------- */
  function bindHUD() {
    $('#btn-hud-book').onclick = () => UI.panelBook();
    $('#btn-bag').onclick = () => UI.panelBag();
    $('#btn-menu').onclick = () => menuPanel();
  }

  function boot() {
    bindTitle();
    bindHUD();
    World.setOnCtx(onCtxChange);
    // 底部「下一时段」由 placelist 附加
    const orig = UI.renderPlaces;
    UI.renderPlaces = function () {
      orig();
      const bar = $('#placelist');
      if (Engine.period() !== 'eve') {
        const b = el('button', 'place-btn here', '下一时段 ▸');
        b.onclick = () => advancePeriod();
        bar.appendChild(b);
      }
    };
    World.start();
  }

  return { boot, onNPC, onEvent, afterDialog, updateCtx, onCtxChange };
})();

window.addEventListener('DOMContentLoaded', () => Main.boot());

</script>
</body>
</html>
